Name: chaininteractive.rpc
ListenOn: 0.0.0.0:8085

# 当前服务请求超时时间是 30s
Timeout: 30000

# 环境：dev、test、pre、prod
Mode: dev

Log:
  # 服务名称
  ServiceName: chain-interactive-service
  # 日志输出到文件
  Mode: file
  # 日志输出文件路径
  Path: logs
  # 日志级别
  Level: info
  # 是否压缩日志
  Compress: true
  # 日志保留天数，只有在文件模式才会生效
  KeepDays: 7
  # 按天切割日志
  Rotation: daily

# 基于 OpenTelemetry 的日志收集链路追踪
Telemetry:
  # 链路追踪开关，不配置默认是开启
  Disabled: true
  # 链路追踪服务名称，跟服务名称保持一致即可
  Name: chain.rpc
  # 链路追踪服务端地址
  Endpoint: http://jaeger:14268/api/traces
  # 采样率，不配置默认是 1.0
  Sampler: 1.0
  # 支持 jaeger|zipkin|otlpgrpc|otlphttp 这些链路追踪工具，不配置默认 jaeger
  Batcher: jaeger

# 监控，默认都是开启，主要调整端口和监控访问路由
DevServer:
  # 监控指标和健康检查的总开关，不配置是默认开启
  Enable: true
  # 监控指标和健康检查的端口
  Port: 6061
  # 健康检查路由，不配置是默认 /healthz
  HealthPath: "/healthz"
  # 健康检查返回，不配置默认是 OK
  HealthResponse: "OK"
  # 监控指标路由，不配置是默认 /metrics
  MetricsPath: "/metrics"

# grpc 通信服务端证书私钥
GrpcConf:
  #CaCertFile: ./cert/ca/ca.pem
  #ServerCertFile: ./cert/chain-service/server.pem
  #ServerKeyFile: ./cert/chain-service/server.key

  CaCertFile: ""
  ServerCertFile: ""
  ServerKeyFile: ""
  # 接收、发送消息大小设置为 20 mb，根据服务实际场景调整
  MaxRecvMsgSize: 20971520
  MaxSendMsgSize: 20971520

SubscribeConf:
  # redis 部署类型，单节点:node,集群:cluster,哨兵:sentinel
  ConfType: node
  # 集群方式下，多个 redis 地址用逗号分隔
  RedisAddr: "127.0.0.1:6379"
  RedisUserName: ""
  RedisPassword: "123456"
  # 哨兵模式的MasterName，其他模式可忽略
  MasterName: ""

# 数据库配置
DatabaseConf:
  # 数据库类型，支持: mysql、kingbase_mysql、kingbase_pgsql、postgres
  Type: "mysql"
  # 数据库连接字符串
  DSN: root:root123456@tcp(127.0.0.1:3306)/chaininteractiveservice?charset=utf8&parseTime=true&loc=Asia%2FShanghai
  # 是否在启动时自动迁移表结构（仅开发/测试环境首次建表时开启，生产环境应设为 false，通过 migration 工具管理）
  AutoMigrate: true
  MaxIdleConns: 25
  MaxOpenConns: 100
