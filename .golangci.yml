version: "2"

run:
  timeout: 10m
  tests: true
  go: "1.21"
  allow-parallel-runners: true

linters:
  # v2：default: none 等价于 v1 的 disable-all: true
  default: none
  enable:
    - goconst
    - gocyclo
    - ineffassign
    - lll
    - misspell
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck  # v2: gosimple / stylecheck 已并入 staticcheck
    - unused
    - govet        # v2: typecheck 自动运行，不可显式启用
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 120
    revive:
      # see https://github.com/mgechev/revive#available-rules for details.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unexported-naming
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: function-length
          arguments: [ 80, 0 ]
  exclusions:
    generated: lax
    # v1 的 exclude-use-default: true 对应的默认排除预设
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - path: _test\.go
        linters:
          - unused
          - ineffassign
          - staticcheck
          - errcheck
          - lll
    # v1 的 issues.exclude-dirs
    paths:
      - cert
      - chain
      - docker
      - etc
      - mock
      - pb
      - proto
      - scripts
      - sql
      - web

formatters:
  # v2：gofmt / goimports 归类为 formatter
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

output:
  sort-results: true
  show-stats: true
